<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000" />
      <stop offset="100%" stop-color="#E60000" />
    </linearGradient>
  </defs>
  
  <!-- Nexus N Icon -->
  <g transform="translate(60, 50)">
    <!-- Network Connections (Nodes) -->
    <polyline points="0,170 -25,90 15,10 95,-15 175,30" fill="none" stroke="#1A1A1A" stroke-width="4"/>
    <circle cx="-25" cy="90" r="9" fill="#1A1A1A"/>
    <circle cx="15" cy="10" r="9" fill="#1A1A1A"/>
    <circle cx="95" cy="-15" r="9" fill="#1A1A1A"/>
    <circle cx="175" cy="30" r="9" fill="#1A1A1A"/>

    <!-- The 'N' Shape -->
    <!-- Left leg -->
    <path d="M 0 170 L 45 170 L 45 30 L 0 30 Z" fill="#1A1A1A"/>
    
    <!-- Diagonal -->
    <path d="M 0 30 L 55 30 L 140 170 L 85 170 Z" fill="url(#redGradient)"/>
    
    <!-- Right leg / Upward Arrow -->
    <path d="M 95 170 L 140 170 L 140 50 L 180 50 L 117.5 -10 L 55 50 L 95 50 Z" fill="url(#redGradient)"/>
  </g>
  
  <!-- Typography -->
  <text x="310" y="115" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="82" font-weight="900" fill="#1A1A1A" letter-spacing="-2">NEXUSTECH</text>
  <text x="315" y="180" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="bold" fill="#E60000" letter-spacing="-1">Solutions</text>
  <text x="320" y="225" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4A4A4A" letter-spacing="5">COMPLETE SEO &amp; DIGITAL GROWTH</text>
</svg>